# Builds the app for both platforms.
#
# Android builds anywhere. **iOS only builds on macOS** — `flutter build` does
# not even register an `ipa` subcommand on a non-macOS host, so this workflow is
# the only route to an iOS artefact unless someone has a Mac.
#
# Artefacts are unsigned by default so this runs green with no setup. Signing is
# opt-in: add the secrets listed under each job and the steps switch on.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which API to build against
        type: choice
        default: staging
        options: [development, staging, production]

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Runs on every push, needs no SDK, and covers 194 tests including every
  # whole-journey flow. If this is red, the platform builds are pointless.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        # --fatal-infos because the project is clean today, and the cheapest way
        # to keep it that way is to refuse the first regression.
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, not the runner default. AGP is picky and a newer JDK is the
          # most common cause of a green local build failing here.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve API base URL
        id: env
        run: |
          case "${{ inputs.environment || 'staging' }}" in
            production)  echo "url=https://jobsflood.com"            >> $GITHUB_OUTPUT ;;
            development) echo "url=http://10.0.2.2:8000"             >> $GITHUB_OUTPUT ;;
            *)           echo "url=https://projobs.proteam.co.in"    >> $GITHUB_OUTPUT ;;
          esac

      - name: Restore the release keystore
        # Opt-in. Without these secrets the build falls back to the debug key,
        # which is installable and testable but NOT publishable to Play.
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=${{ inputs.environment || 'staging' }} \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.url }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=${{ inputs.environment || 'staging' }} \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.url }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.environment || 'staging' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Clean up signing material
        # Belt and braces: the runner is ephemeral, but a keystore should never
        # outlive the step that needed it.
        if: always()
        run: rm -f android/app/release.keystore android/key.properties

  # ---------------------------------------------------------------------------
  # iOS — macOS runner, because there is no other way.
  # ---------------------------------------------------------------------------
  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve API base URL
        id: env
        run: |
          case "${{ inputs.environment || 'staging' }}" in
            production)  echo "url=https://jobsflood.com"         >> $GITHUB_OUTPUT ;;
            development) echo "url=http://127.0.0.1:8000"         >> $GITHUB_OUTPUT ;;
            *)           echo "url=https://projobs.proteam.co.in" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build (unsigned)
        # --no-codesign produces a runnable .app and proves the iOS build is
        # sound, without needing certificates in CI. Swap for the signed step
        # below once the developer account is wired up.
        run: |
          flutter build ipa --no-codesign \
            --dart-define=APP_ENV=${{ inputs.environment || 'staging' }} \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.url }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.environment || 'staging' }}-unsigned
          path: build/ios/archive/*.xcarchive
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The on-device smoke test — the ONE thing no headless test can answer:
  # whether flutter_secure_storage really reaches the Keychain rather than
  # falling back to something readable.
  # ---------------------------------------------------------------------------
  ios-device-test:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl boot "iPhone 16" || true

      - name: Integration test
        run: |
          flutter test integration_test/app_test.dart \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000
