# Signed iOS build, straight to TestFlight.
#
# Run it by hand (Actions -> release-ios -> Run workflow) or by pushing a tag
# like v1.0.0. It is deliberately NOT on every push: each run uses a macOS
# runner and uploads a build to App Store Connect.
#
# NOTHING here is committed. The certificate, profile and API key live in
# repository secrets, are written to a TEMPORARY keychain on an ephemeral
# runner, and are destroyed in an `always()` step. See RELEASE-IOS.md for how to
# produce each one — you create them, not this workflow.

name: release-ios

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which API to build against
        type: choice
        default: production
        options: [production, staging]
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The `secrets` context is NOT allowed in an `if:` condition — using it
      # there makes GitHub reject the entire workflow file, which it reports as
      # a failed run named after the file path with no jobs at all. Job-level
      # env is where secrets may be read, so the boolean is computed here and
      # the step tests this instead.
      HAS_ASC_KEY: ${{ secrets.APPSTORE_KEY_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fail early and legibly. Without this the build gets most of the way
      # through and then dies inside codesign with something inscrutable.
      - name: Check the required secrets are present
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -z "$CERT" ]    && missing="$missing IOS_CERTIFICATE_BASE64"
          [ -z "$CERT_PW" ] && missing="$missing IOS_CERTIFICATE_PASSWORD"
          [ -z "$PROFILE" ] && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$TEAM" ]    && missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See RELEASE-IOS.md for how to produce each one."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Import the certificate and profile
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, not the login one. Its password is random and
          # never leaves this step.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Lets codesign use the key without an interactive prompt, which on a
          # headless runner would simply hang until the job times out.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Imported. Profile UUID $uuid"

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Manual signing, not automatic. Automatic needs an interactive Xcode
          # session to talk to Apple, which a runner does not have.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.jobsflood.jobportalMobile</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Resolve API base URL
        id: env
        run: |
          if [ "${{ inputs.environment || 'production' }}" = "staging" ]; then
            echo "url=https://projobs.proteam.co.in" >> "$GITHUB_OUTPUT"
            echo "app_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://jobsflood.com" >> "$GITHUB_OUTPUT"
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=APP_ENV=${{ steps.env.outputs.app_env }} \
            --dart-define=API_BASE_URL=${{ steps.env.outputs.url }}
          ls -la build/ios/ipa/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.env.outputs.app_env }}-signed
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        # App Store Connect API key, not an app-specific password: it is
        # revocable on its own, scoped, and does not belong to a person's Apple
        # ID. Skipped when the key is absent, so a signed build still succeeds.
        if: ${{ inputs.upload != false && env.HAS_ASC_KEY == 'true' }}
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading $ipa"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Destroy the signing material
        # The runner is ephemeral, but a certificate should never outlive the
        # step that needed it.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
