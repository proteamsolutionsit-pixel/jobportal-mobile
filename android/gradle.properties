org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation OFF for local builds.
#
# Every local debug build failed at :image_picker_android:compileDebugKotlin with
#   Could not close incremental caches in ...caches-jvm/jvm/kotlin
# and it recurred on a completely fresh build/ directory, so it is not stale
# corruption. The project path contains spaces ("AI Job portal/jobportal mobile
# app"), which this Kotlin cache layer handles badly on Windows.
#
# CI is unaffected either way -- its checkout path has no spaces and it builds
# clean. Turning this off costs rebuild speed, not correctness.
kotlin.incremental=false
