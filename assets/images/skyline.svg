<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300"
     preserveAspectRatio="xMidYMax slice" role="img" aria-hidden="true">
  <title>Decorative city skyline</title>
  <!--
    The light footer's skyline. Offices, which is where the jobs are.

    Colour comes from the logo's own palette — its two blues and its orange —
    plus a few supporting hues, so the band reads as part of the brand rather
    than as stock decoration.

    THE FADE IS STILL THE POINT. Everything is drawn through a vertical mask
    that is transparent at the top of the band and only reaches partial
    strength at the base, so the type above it stays legible. On the dark
    footer this stopped the copyright line disappearing; on a white one the
    same rule stops saturated blocks fighting dark text. If they ever compete,
    weaken the buildings, never the text.
  -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1600" height="300" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#fadeMask)">
